name: Build Signed Release AAB & APK (Shayari Lok)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Test, Sign & Bundle Release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Prepare Gradle Wrapper and Debug Keystore
        run: |
          chmod +x ./gradlew
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi

      - name: Decode and Validate Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing GitHub Secret: RELEASE_KEYSTORE_BASE64"
            echo "Create a 2048-bit RSA keystore with alias 'upload' and store its base64 output in GitHub Secrets."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Missing GitHub Secret: STORE_PASSWORD or KEY_PASSWORD"
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE_FILE}"

          if [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Decoded release.keystore is empty. Check RELEASE_KEYSTORE_BASE64."
            exit 1
          fi

          if ! keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASSWORD}" -alias upload >/dev/null 2>&1; then
            echo "::error::Keystore validation failed. Check STORE_PASSWORD and ensure key alias 'upload' exists."
            keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASSWORD}" || true
            exit 1
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Signed Release AAB & APK (R8 Minified)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Signed Release AAB & APK
        run: |
          set -euo pipefail
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"
          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          test -s "${AAB_FILE}" || { echo "::error::Missing release AAB at ${AAB_FILE}"; exit 1; }
          test -s "${APK_FILE}" || { echo "::error::Missing release APK at ${APK_FILE}"; exit 1; }

          jarsigner -verify -verbose -certs "${AAB_FILE}"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "${SDK_ROOT}/build-tools" -name "apksigner" -type f | sort -V | tail -n 1 || true)
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner binary not found under ${SDK_ROOT}/build-tools"
            exit 1
          fi
          "${APKSIGNER}" verify --verbose --print-certs "${APK_FILE}"

          ls -lh "${AAB_FILE}" "${APK_FILE}"

      - name: Clean Up Temporary Keystores
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release.keystore"
          rm -f debug.keystore

      - name: Upload Signed Release Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shayari-lok-release-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
